name: Build Turnip (Adreno 616, Android arm64)

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: "Mesa branch, tag or commit (for example: main)"
        default: "main"
      api_level:
        description: "Android API level to target (your phone runs Android 11 = 30; 28 is safe)"
        default: "28"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config bison flex glslang-tools \
            python3-pip python3-venv zip cmake libxml2-utils
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" install meson mako pyyaml ply packaging

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Get Mesa source
        env:
          REF: ${{ inputs.mesa_ref }}
        run: |
          git clone --filter=blob:none https://gitlab.freedesktop.org/mesa/mesa.git
          cd mesa
          git checkout "$REF"
          echo "SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Write Android cross file
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
          API: ${{ inputs.api_level }}
        run: |
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > android-aarch64.txt <<CROSS
          [binaries]
          ar = '$BIN/llvm-ar'
          c = ['$BIN/aarch64-linux-android$API-clang']
          cpp = ['$BIN/aarch64-linux-android$API-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '-static-libstdc++']
          c_ld = 'lld'
          cpp_ld = 'lld'
          strip = '$BIN/llvm-strip'
          pkg-config = ['/bin/false']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'

          [built-in options]
          # Safe tuning for the Snapdragon 712 (Cortex-A75 / A55 class cores).
          # -mtune only changes scheduling; it never adds instructions your CPU might lack.
          c_args = ['-mtune=cortex-a75']
          cpp_args = ['-mtune=cortex-a75']
          CROSS
          sed -i 's/^          //' android-aarch64.txt

      - name: Configure and build
        env:
          API: ${{ inputs.api_level }}
        run: |
          export PATH="$HOME/venv/bin:$PATH"
          cd mesa
          meson setup build --cross-file ../android-aarch64.txt \
            -Dbuildtype=release -Db_ndebug=true -Db_lto=false -Dstrip=true \
            -Dplatforms=android -Dplatform-sdk-version="$API" \
            -Dandroid-stub=true -Dandroid-libbacktrace=disabled \
            -Dgallium-drivers= -Dvulkan-drivers=freedreno -Dfreedreno-kmds=kgsl \
            -Dllvm=disabled -Dglx=disabled -Degl=disabled -Dgbm=disabled
          ninja -C build src/freedreno/vulkan/libvulkan_freedreno.so

      - name: Package driver zip
        run: |
          mkdir pkg
          cp mesa/build/src/freedreno/vulkan/libvulkan_freedreno.so pkg/
          cat > pkg/meta.json <<META
          {
            "schemaVersion": 1,
            "name": "Turnip custom A616 ${SHORT}",
            "description": "Mesa ${SHORT}, built for Adreno 616",
            "author": "self-built",
            "packageVersion": "1",
            "vendor": "Mesa",
            "driverVersion": "Vulkan 1.4",
            "minApi": 28,
            "libraryName": "libvulkan_freedreno.so"
          }
          META
          sed -i 's/^          //' pkg/meta.json
          cd pkg && zip -9 "../Turnip_custom_A616_${SHORT}.zip" libvulkan_freedreno.so meta.json

      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: turnip-driver
          path: Turnip_custom_A616_*.zip
