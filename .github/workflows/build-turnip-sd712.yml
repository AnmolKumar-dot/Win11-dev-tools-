name: Build Turnip for Snapdragon 712 (Adreno 616) - XHNY V Reborn

# How to use: Actions tab > "Build Turnip for Snapdragon 712" > Run workflow.
# Download the "turnip-sd712" artifact, unzip it, put the inner Turnip_*.zip in the
# game's Drivers folder and set driver_zip=<that file name> in Config/android.ini.

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: "latest-release (stable, recommended), main (newest, riskier), or any Mesa tag/commit"
        default: "latest-release"
      api_level:
        description: "Android API level to target (28 works on Android 9 and newer)"
        default: "28"
      lto:
        description: "Link-time optimization: false (safe) or true (slightly faster, may fail)"
        default: "false"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config bison flex glslang-tools \
            python3-pip python3-venv zip file cmake libxml2-utils
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" install meson mako pyyaml ply packaging

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Get Mesa source
        env:
          REF: ${{ inputs.mesa_ref }}
        run: |
          if [ "$REF" = "latest-release" ]; then
            REF=$(git ls-remote --tags --refs https://gitlab.freedesktop.org/mesa/mesa.git 'mesa-*' \
              | sed 's|.*refs/tags/||' \
              | grep -E '^mesa-[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -1)
            echo "Latest stable release tag: $REF"
          fi
          test -n "$REF"
          git clone --filter=blob:none https://gitlab.freedesktop.org/mesa/mesa.git
          cd mesa
          git checkout "$REF"
          echo "BUILD_REF=$REF" >> "$GITHUB_ENV"
          echo "SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Write Android cross file
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
          API: ${{ inputs.api_level }}
        run: |
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > android-aarch64.txt <<CROSS
          [binaries]
          ar = '$BIN/llvm-ar'
          c = ['$BIN/aarch64-linux-android$API-clang']
          cpp = ['$BIN/aarch64-linux-android$API-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '-static-libstdc++']
          c_ld = 'lld'
          cpp_ld = 'lld'
          strip = '$BIN/llvm-strip'
          pkg-config = ['/bin/false']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'

          [built-in options]
          # Snapdragon 712 = Cortex-A75 / A55 class cores. -mtune only changes
          # instruction scheduling and never adds instructions the CPU might lack.
          c_args = ['-mtune=cortex-a75']
          # -Wno-c++11-narrowing: clang treats Mesa's size_t -> uint32_t initializers as errors.
          cpp_args = ['-mtune=cortex-a75', '-Wno-c++11-narrowing']
          CROSS

      - name: Configure and build
        env:
          API: ${{ inputs.api_level }}
          LTO: ${{ inputs.lto }}
        run: |
          export PATH="$HOME/venv/bin:$PATH"
          cd mesa
          meson setup build --cross-file ../android-aarch64.txt \
            -Dbuildtype=release -Db_ndebug=true -Db_lto="$LTO" -Dstrip=true \
            -Dplatforms=android -Dplatform-sdk-version="$API" \
            -Dandroid-stub=true -Dandroid-libbacktrace=disabled \
            -Dgallium-drivers= -Dvulkan-drivers=freedreno -Dfreedreno-kmds=kgsl \
            -Dllvm=disabled -Dglx=disabled -Degl=disabled -Dgbm=disabled
          ninja -C build src/freedreno/vulkan/libvulkan_freedreno.so

      - name: Check the driver before packaging
        run: |
          SO=mesa/build/src/freedreno/vulkan/libvulkan_freedreno.so
          ls -l "$SO"
          file "$SO"
          readelf -h "$SO" | grep -q "AArch64"
          readelf -d "$SO" | grep SONAME | grep -q "libvulkan_freedreno.so"
          if readelf -d "$SO" | grep NEEDED | grep -q "libc++_shared"; then
            echo "Driver depends on libc++_shared, which the game will not provide"; exit 1
          fi
          test "$(stat -c %s "$SO")" -gt 5000000
          echo "NEEDED libraries:"; readelf -d "$SO" | grep NEEDED

      - name: Package driver zip
        run: |
          mkdir pkg
          cp mesa/build/src/freedreno/vulkan/libvulkan_freedreno.so pkg/
          cat > pkg/meta.json <<META
          {
            "schemaVersion": 1,
            "name": "Turnip SD712 ${BUILD_REF} ${SHORT}",
            "description": "Mesa ${BUILD_REF} (${SHORT}) built for Adreno 616",
            "author": "self-built",
            "packageVersion": "1",
            "vendor": "Mesa",
            "driverVersion": "Vulkan 1.4",
            "minApi": 28,
            "libraryName": "libvulkan_freedreno.so"
          }
          META
          cd pkg
          zip -9 "../Turnip_SD712_${BUILD_REF}_${SHORT}.zip" libvulkan_freedreno.so meta.json
          cd ..
          sha256sum Turnip_SD712_*.zip

      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: turnip-sd712
          path: Turnip_SD712_*.zip
